<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clash of Vikings</title>
<style>
:root{color-scheme:dark;--bg:#0d1420;--pn:#182234;--p2:#223149;--mu:#8fa0b5;--ac:#f5b53d;--rd:#e5484d;--gr:#34c38f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;color:#eef2f7;background:var(--bg);font:600 15px/1.35 system-ui,'Inter','Segoe UI',Roboto,sans-serif;overflow:hidden;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{position:absolute;inset:0;display:none;padding:18px 16px;overflow:auto;touch-action:pan-y;background:radial-gradient(circle at 50% -10%,#24385c,var(--bg) 65%)}
.scr.on{display:flex;flex-direction:column;align-items:center}
#menu{justify-content:center}
h1{margin:4px 0;font-size:clamp(30px,8vw,48px);font-weight:800;color:var(--ac);text-shadow:0 3px 0 #6b4200;text-align:center}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px;text-align:center}.mu{color:var(--mu);margin:2px 0;font-size:12px}
.btn{width:100%;padding:14px 18px;border-radius:14px;background:var(--p2);font-weight:700;box-shadow:0 2px 0 #0007,0 6px 14px #0004;transition:transform .15s,background .15s}
.btn:hover{background:#2f4468;transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
.pri{background:linear-gradient(#f7c862,#e39a1d);color:#2a1800}.pri:hover{background:linear-gradient(#ffd878,#f0a928)}
.btn[disabled]{opacity:.4;pointer-events:none}
.mg,.grid,.list{display:grid;gap:10px;width:min(440px,100%)}.grid{grid-template-columns:1fr 1fr}
.pill{display:inline-block;margin:3px;padding:8px 14px;border-radius:99px;background:var(--pn);box-shadow:0 2px 6px #0005}.pill b{color:var(--ac)}
@media(min-width:900px) and (min-height:560px){.mg{grid-template-columns:1fr 1fr;width:660px}.wide{grid-column:1/-1}.grid{grid-template-columns:repeat(4,1fr);width:820px}.list{width:640px}h1{font-size:60px}}
.tile{position:relative;padding:12px 8px;border-radius:14px;background:var(--pn);text-align:center;box-shadow:0 2px 8px #0005;overflow:hidden;transition:transform .15s;cursor:pointer}
.tile:hover{transform:translateY(-3px)}.tile img{width:72px;height:72px}
.tile.in{outline:2px solid var(--gr)}.tile.lk img{filter:grayscale(1) brightness(.5)}
.tile button{margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--p2);font-size:12px}
.rw{display:flex;gap:14px;align-items:center;text-align:left}
.foil{background:linear-gradient(115deg,#35255f,#6a35a8 35%,#1f6b8c 65%,#35255f)}
.foil::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#fff7 50%,transparent 65%) 130% 0/250% 100%;transition:background-position .7s}
.foil:hover::after{background-position:-30% 0}
#game{padding:0;justify-content:center}
#gw{position:relative;width:360rem;background:#0b1220;border-radius:14rem;box-shadow:0 10px 50px #000b;overflow:hidden}
#top,#bot{padding:4rem 6rem;background:var(--pn)}
.hud{display:flex;align-items:center;justify-content:space-between;height:32rem;font-size:15rem}
.ib{width:30rem;height:26rem;border-radius:8rem;background:var(--p2);font-size:12rem;font-weight:800}
#tm{font-size:20rem}
#cv{display:block;width:360rem;height:540rem}
.hand{display:flex;gap:5rem;align-items:flex-end;justify-content:center}
.cd{position:relative;width:68rem;height:80rem;border-radius:10rem;background:linear-gradient(#2c4062,#1b2740);box-shadow:0 2rem 0 #0008;transition:transform .15s;padding:0;overflow:hidden}
.cd:hover{transform:translateY(-3rem)}.cd img{width:100%;height:76%;object-fit:contain}
.cd i{position:absolute;left:3rem;top:3rem;width:20rem;height:20rem;border-radius:50%;background:#b146f0;font:800 12rem/20rem system-ui;font-style:normal;text-align:center}
.cd small{position:absolute;bottom:3rem;left:0;right:0;font-size:9rem;color:var(--mu);text-align:center}
.cd.sel{outline:2rem solid var(--ac);transform:translateY(-8rem)}.cd.no{opacity:.5;filter:grayscale(.6)}
.nx{width:36rem;height:44rem;opacity:.8}.nx img{height:100%}
.eb{position:relative;height:14rem;margin:2rem 0 5rem;background:#0008;border-radius:8rem;overflow:hidden}
.eb i{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(90deg,#b146f0,#e08cff)}
.eb b{position:absolute;inset:0;text-align:center;font-size:10rem;line-height:14rem}
.one #eb1,.one #h1{display:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(4px)}#ov.on{display:flex}
.pnl{width:min(360px,92vw);padding:22px;border-radius:18px;background:var(--pn);box-shadow:0 12px 40px #000c;text-align:center}
.pnl h2{margin:0 0 10px;font-size:34px;color:var(--ac)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #fff1}
#road{scroll-behavior:smooth;overscroll-behavior:contain}#menu{padding:0;justify-content:flex-start}.hub{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:linear-gradient(#1a202c,#2d3748);border-bottom:3px solid #4a5568}.avatar{position:relative;flex:none;width:46px;height:46px;border-radius:10px;background:linear-gradient(145deg,#f6e05e,#f6ad55);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px}.avatar b{position:absolute;bottom:-7px;right:-7px;background:#805ad5;border:2px solid #fff;border-radius:8px;font-size:12px;padding:0 5px}.xb{flex:1;min-width:0}.xb small{font-size:13px;color:#cbd5e0}.bar{height:12px;background:#1a202c;border:2px solid #a0aec0;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b794f4,#805ad5)}.pl{background:rgba(0,0,0,.45);border:2px solid #4a5568;border-radius:14px;padding:2px 8px;white-space:nowrap}.hb{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}.panel{width:100%;background:rgba(0,0,0,.35);border:3px solid #4a5568;border-radius:16px;padding:12px;text-align:center}.arena{background:radial-gradient(circle,#2e5b3c,#224631);border-color:#f6ad55}.nav{display:flex;background:linear-gradient(#2d3748,#1a202c);border-top:3px solid #4a5568;padding:0 4px env(safe-area-inset-bottom,0px)}.tab{flex:1;padding:8px 0 6px;text-align:center;font-size:13px;color:#a0aec0;cursor:pointer;transition:transform .15s}.tab i{display:block;font-size:22px;font-style:normal}.tab.on{color:#2d3748;background:linear-gradient(#f6e05e,#f6ad55);border-radius:12px 12px 0 0;transform:translateY(-6px);padding-bottom:12px}.hub .grid{grid-template-columns:1fr 1fr;width:100%}.hub .list{width:100%}.rr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;width:100%}.rb{padding:10px 8px;border-radius:12px;background:var(--p2);border:2px solid #4a5568;text-align:center}.rb small{display:block;font-size:11px;color:var(--mu);font-weight:500}.rb.on{border-color:#f6e05e;background:#3b4a63}.rb.lk{opacity:.5}
.chestbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#293e5a,#182638);border-color:#c58a31}.chesticon{font-size:38px;filter:drop-shadow(0 4px 3px #0008)}.rb img{object-fit:contain}.rb:active{transform:scale(.97)}.arena{box-shadow:inset 0 0 25px #f6ad5520,0 6px 18px #0006}.panel{box-shadow:0 5px 16px #0005}.tab{font-weight:800}.tab.on{color:#2d3748}.cd{border:2px solid #8296b4}.cd.sel{border-color:#ffe066;box-shadow:0 0 0 2px #f6ad5566,0 8px 18px #0008}.tile{border:1px solid #ffffff12}.rb.on{box-shadow:0 0 0 2px #f6e05e55}#matchnames{color:#f6d58a;font-weight:800;letter-spacing:.2px}.emote-ui{position:relative;z-index:8;width:100%;min-height:36rem;display:none;align-items:center;justify-content:flex-end;gap:7rem;margin:3rem 0 5rem}.emote-ui.on{display:flex}.emote-toggle{border:2px solid #f6ad55;border-radius:12rem;min-width:42rem;height:34rem;background:linear-gradient(#3b5276,#25354d);font-size:20rem;box-shadow:0 3px 10px #0008}.emote-tray{display:none;position:absolute;right:0;bottom:calc(100% + 6rem);padding:8rem;background:linear-gradient(145deg,#243957,#101a2d);border:2px solid #f6ad55;border-radius:14rem;grid-template-columns:repeat(4,minmax(36rem,44rem));gap:6rem;box-shadow:0 8px 24px #000b;animation:emoteIn .16s ease-out}.emote-tray.on{display:grid}.emote-pick{height:38rem;border-radius:10rem;background:linear-gradient(#3c5274,#263751);font-size:22rem;border:1px solid #ffffff22}.emote-pick:active{transform:scale(.92)}.emote-toast{position:absolute;z-index:9;left:50%;bottom:112rem;top:auto;transform:translateX(-50%);display:none;padding:7rem 13rem;border-radius:18rem;background:#172238ee;border:2px solid #f6ad55;font-size:28rem;box-shadow:0 4px 16px #0009;white-space:nowrap;pointer-events:none}.emote-toast.on{display:block;animation:emoteIn .18s ease-out}@keyframes emoteIn{from{opacity:0;transform:translateY(7rem) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}.rw{min-height:76px}
@keyframes sp{to{transform:rotate(1turn)}}
#mo{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:#000b;backdrop-filter:blur(4px)}#mo.on{display:flex}#mo .pnl{max-height:92vh;overflow:auto;touch-action:pan-y}
.chh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}.chh b{font-size:16px}
.sls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.sl{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:106px;padding:8px 2px 12px;border-radius:12px;background:linear-gradient(#2a3b57,#1a2538);border:2px solid #4a5568;font-size:11px;overflow:hidden}
.sl.em{border-style:dashed;opacity:.5;justify-content:center}.sl.ul{border-color:#f6ad55}.sl.go{border-color:var(--gr);box-shadow:0 0 14px #34c38f88;animation:pu .8s infinite alternate}
.sl small{font-size:10px;color:var(--mu);font-weight:700}.sl.go small{color:var(--gr)}
.cs{width:44px;height:44px}.cs svg{display:block;width:100%;height:100%}
.pb{position:absolute;left:5px;right:5px;bottom:4px;height:5px;border-radius:4px;background:#0009;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#f6e05e,#f6ad55)}
.rar{font-size:10px;font-weight:800;letter-spacing:.3px}.chip{display:inline-block;margin:2px;padding:2px 9px;border-radius:99px;border:1px solid;font-size:11px;font-weight:800}
.rh{grid-column:1/-1;text-align:left;font-weight:800;padding:2px 2px 4px;border-bottom:2px solid}.tile[data-c]{border-top:3px solid var(--rc)}
@keyframes pu{to{transform:scale(1.05)}}
/* ===== Battle deck + rune picker (Clash Royale style) ===== */
.hb.kbg{background:linear-gradient(#1648ac,#0f3079 40%,#0a1f58)}
.kd,.kd2{width:100%;font-size:clamp(10px,2.9vw,14.5px)}
.kd{padding:.9em .7em .9em;border-radius:1.5em;background:linear-gradient(#0b2563aa,#081d52cc);box-shadow:inset 0 0 0 2px #2f66d0,inset 0 0 0 4px #09194a,0 6px 16px #0006}
.kh{display:flex;align-items:center;justify-content:space-between;margin:0 .15em .5em}
.kh b{font-size:1.5em;font-weight:900;color:#fff;text-shadow:0 .1em 0 #06143a,.06em 0 0 #06143a,-.06em 0 0 #06143a,0 -.06em 0 #06143a}
.kcnt{padding:.15em .8em;border-radius:99px;background:#07173f;color:#ffd35c;font-size:1.05em;font-weight:900;box-shadow:inset 0 0 0 1px #2a4a9a}
.kd .sub{margin:0 .2em .8em;min-height:2.7em;font-size:1.05em;color:#aac5f6;text-align:left}
.kg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55em;width:100%}
.kd2{margin-top:.3em}.kd2 .kh{margin-top:.8em}
.kg .rh{font-size:1.1em;margin-top:.5em}

/* slot tile that holds one card */
.ks{--q1:#86a9dc;--q2:#2f4f86;--b1:#2b3d7d;--b2:#18244f;--bt:#b4e2ff;--bo:#08113a;position:relative;display:flex;flex-direction:column;gap:.4em;min-width:0;padding:.55em .4em .4em;border-radius:.9em;background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px #2a4fa6,0 .15em 0 #04102f;cursor:pointer;touch-action:manipulation;transition:transform .12s}
.ks:active{transform:scale(.96)}
.ks:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(hover:hover){.ks:hover{transform:translateY(-2px)}.ks:active{transform:scale(.96)}}
.q-c{--q1:#86a9dc;--q2:#2f4f86;--b1:#2b3d7d;--b2:#18244f;--bt:#b4e2ff;--bo:#08113a}
.q-r{--q1:#f8b866;--q2:#b4620f;--b1:#df8123;--b2:#a9560b;--bt:#ffe596;--bo:#4a2200}
.q-e{--q1:#dc98ff;--q2:#7a34c0;--b1:#e8b6fb;--b2:#bb78e8;--bt:#5b2092;--bo:#fff}
.q-l{--q1:#8ff6e8;--q2:#18808f;--b1:#52e6d4;--b2:#1c98ac;--bt:#ffbdf2;--bo:#07404c}
.ks.sel{background:linear-gradient(#1b5bb8,#12408a);box-shadow:inset 0 0 0 2px #8ff0ff,0 0 0 2px #1d9be0,0 0 .9em .15em #35d0ffaa;animation:kpop .28s ease-out}
.ks.nw{animation:kpop .32s ease-out}
@keyframes kpop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ks.sel,.ks.nw{animation:none}}

/* gold frame + portrait (chamfered like the real card) */
.kc{position:relative;width:100%;aspect-ratio:.88;background:linear-gradient(155deg,#fff2a8,#f4bd32 35%,#c4821a 68%,#f7d35f);clip-path:polygon(20% 0,80% 0,100% 11%,100% 90%,80% 100%,20% 100%,0 90%,0 11%)}
.kp{position:absolute;inset:.34em;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--q1),var(--q2) 78%);clip-path:polygon(20% 0,80% 0,100% 11%,100% 90%,80% 100%,20% 100%,0 90%,0 11%)}
.kp img{position:absolute;left:7%;top:5%;width:86%;height:74%;object-fit:contain;filter:drop-shadow(0 .15em .2em #0008)}
.kp::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 38%,#ffffff2e 50%,transparent 62%);pointer-events:none}
.kl{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:.24em 0 .3em;text-align:center;font-size:.95em;font-weight:900;line-height:1.1;color:var(--bt);background:linear-gradient(var(--b1),var(--b2));text-shadow:0 .07em 0 var(--bo),.06em 0 0 var(--bo),-.06em 0 0 var(--bo),0 -.06em 0 var(--bo),.05em .05em 0 var(--bo),-.05em .05em 0 var(--bo);box-shadow:inset 0 1px 0 #ffffff55}
.ks.lk .kc{filter:saturate(.3) brightness(.7)}
.ks.lk .kp{background:radial-gradient(circle at 50% 36%,#52607a,#222c42 80%)}
.ks.lk .kp img{filter:grayscale(1) brightness(.55)}
.ks.lk .kl{--b1:#3a4660;--b2:#222b40;--bt:#9aa8c4;--bo:#0b1226}

/* elixir drop */
.kx,.kdrop{display:flex;align-items:center;justify-content:center;border-radius:50% 0 50% 50%;background:radial-gradient(circle at 35% 30%,#ff9bff,#cf3cee 45%,#7a16a8);border:.14em solid #f6d0ff;box-shadow:0 .12em .25em #0008,inset 0 -.15em .2em #5b0f7e88}
.kx{position:absolute;z-index:2;left:-.25em;top:-.25em;width:2.1em;height:2.1em;font-size:1.05em;font-weight:900;font-style:normal;line-height:1;color:#fff;text-shadow:0 .07em 0 #4b0a66,.06em 0 0 #4b0a66,-.06em 0 0 #4b0a66,0 -.06em 0 #4b0a66}
.ks.lk .kx{filter:grayscale(.8) brightness(.8)}
.kt{margin:-.1em 0 -.05em;overflow:hidden;font-size:.8em;font-weight:800;line-height:1.15;color:#d4e3ff;text-align:center;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 #04102f}
.kt.s{font-size:.7em}
.kt.ph{visibility:hidden}
.ks.lk .kt{color:#8b9cc0}

/* Elite pill and upgrade pill under every card */
.kb{position:relative;display:flex;align-items:center;justify-content:center;gap:.35em;height:2em;margin:0;padding:0 .3em;border:0;font-size:.9em;font-weight:900;line-height:1;color:#fff;white-space:nowrap}
.kb.ph{visibility:hidden}
.kb.el{justify-content:space-between;padding:0 .8em;background:linear-gradient(#fff3a6,#f6c940 40%,#d89a1a);clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);text-shadow:0 .07em 0 #8b5400,.06em 0 0 #8b5400,-.06em 0 0 #8b5400,0 -.06em 0 #8b5400}
.kb.el::before,.kb.el::after{content:'';flex:none;width:.5em;height:.5em;background:linear-gradient(#8fd0ff,#2f86e6);border:.1em solid #eaf6ff;transform:rotate(45deg)}
.kb.up{background:#15286a;border-radius:1em;color:#aab8ea;font-size:.78em;font-weight:800;justify-content:flex-start;padding:0 .55em 0 .35em;box-shadow:inset 0 0 0 1px #2a448f}
.kb.up svg{flex:none;width:1.5em;height:1.5em;fill:#ffc12b;stroke:#b9770a;stroke-width:1.2;stroke-linejoin:round}
.kb.up.ok{background:linear-gradient(#7bea6f,#2fae3a);color:#fff;box-shadow:inset 0 0 0 1px #c9ffbf,0 .12em 0 #17661d;text-shadow:0 1px 0 #17661d}
.kb.up.ok svg{fill:#fff;stroke:#17661d}
.ko{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:.88;border:2px dashed #3f66b8;border-radius:.8em;color:#5f86da;font-size:2.4em;font-weight:900;line-height:1}
.ks.em{cursor:default;background:linear-gradient(#0d2356,#081a42);opacity:.85}
.ks.em:active{transform:none}

/* footer: average elixir + runes button */
.kf{display:flex;align-items:center;justify-content:space-between;margin-top:.8em;padding:0 .1em}
.kv{display:flex;align-items:center;gap:.8em;height:4em;padding:0 1.4em 0 1em;border-radius:.9em;background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px #2a4fa6}
.kv b{font-size:1.9em;font-weight:900;color:#fff;text-shadow:0 .07em 0 #06143a,.06em 0 0 #06143a,-.06em 0 0 #06143a,0 -.06em 0 #06143a}
.kdrop{flex:none;width:2.2em;height:2.2em}
.km{position:relative;width:4.4em;height:4.4em;padding:.22em;border-radius:1em;background:linear-gradient(#ffe48a,#f0b32a 45%,#b8740f);box-shadow:0 .18em 0 #6a3d00,0 .3em .6em #0007;display:block;transition:transform .12s}
.km:active{transform:scale(.94)}
.km:focus-visible{outline:2px solid #fff;outline-offset:3px}
.kin{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:.78em;background:radial-gradient(circle at 50% 30%,#30d0c4,#14687f 70%,#0c3d58);box-shadow:inset 0 0 0 .1em #0a3a52,inset 0 .1em .3em #7ff6e866}
.kst{display:flex;align-items:center;justify-content:center;width:62%;height:78%;border-radius:48% 48% 14% 14%/30% 30% 10% 10%;background:linear-gradient(#cdd7ea,#8593b0 55%,#5b6785);box-shadow:inset 0 0 0 .1em #eef3fb99,0 .15em .25em #0008}
.kgl{width:56%;height:68%;color:#58f2ff;filter:drop-shadow(0 0 .25em #34e0ff)}
.kgl.off{color:#6a7898;filter:none;opacity:.85}
.kn{position:absolute;right:-.55em;top:-.65em;display:flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .35em;border-radius:.45em;background:linear-gradient(#ff6a6a,#d71f2b);border:.14em solid #fff;color:#fff;font-size:.95em;font-style:normal;font-weight:900;text-shadow:0 1px 0 #7a0b12;box-shadow:0 .1em .2em #0007}

/* rune picker sheet */
#mo .pnl.kr{display:flex;flex-direction:column;overflow:hidden;max-height:min(92vh,760px);width:min(390px,94vw);padding:16px 12px 14px;background:linear-gradient(#17479f,#0d2c70);border:3px solid #f1b92f;box-shadow:inset 0 0 0 2px #0a1f55,0 14px 40px #000c}
.kr h2{margin:0 0 2px;font-size:28px;color:#fff;text-shadow:0 2px 0 #06143a}
.kr .sub{margin:0 0 10px;font-size:13px;color:#aac5f6}
.kr #rmsg{flex:none;min-height:2.7em;margin:8px 0 6px;color:#ffd35c}
.kr .btn{flex:none}
.rg2{display:grid;flex:1;grid-template-columns:1fr 1fr;gap:8px;min-height:0;padding:3px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.rn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 8px;border-radius:14px;background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px #2a4fa6;text-align:center;color:#fff;transition:transform .12s}
.rn:active{transform:scale(.97)}
